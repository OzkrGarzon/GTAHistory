<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Barra de Progreso GTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .widget-container {
            width: 520px;
            background: rgba(18, 14, 28, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #f5a623;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 0 30px rgba(245, 166, 35, 0.35);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        }
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .widget-header h3 {
            font-size: 0.95rem;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }
        #globalPctDisplay {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f5a623;
        }
        .global-bar-bg {
            background-color: #050408;
            height: 14px;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(245, 166, 35, 0.5);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .global-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5a623, #f43f5e, #00f0ff);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px #f5a623;
        }
        #globalStatsText {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #fb7185;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="widget-header">
            <h3>Progreso Saga GTA</h3>
            <span id="globalPctDisplay">0%</span>
        </div>
        <div class="global-bar-bg">
            <div id="globalBarFill" class="global-bar-fill"></div>
        </div>
        <p id="globalStatsText">Cargando...</p>
    </div>

    <script>
        const expectedStoryTotals = { gtavc: 48, gtasa: 100, gta3: 51, gta4: 46, gta5: 42 };
        const absoluteTotalMissions = 287;

        function updateWidgetLive() {
            let localData = {};
            const savedCache = localStorage.getItem('gta_progress_autonomous');
            if (savedCache) {
                try { localData = JSON.parse(savedCache); } catch(e){}
            }

            let totalCompletedAllGames = 0;
            Object.keys(expectedStoryTotals).forEach(gameKey => {
                const gameData = localData[gameKey] || {};
                Object.values(gameData).forEach(task => {
                    if (task && task.done) totalCompletedAllGames++;
                });
            });

            const globalPct = Math.min(100, Math.round((totalCompletedAllGames / absoluteTotalMissions) * 100));
            const activeMissionName = localStorage.getItem('gta_current_mission_name') || "Ninguna misión en curso";
            
            document.getElementById('globalPctDisplay').innerText = `${globalPct}%`;
            document.getElementById('globalBarFill').style.width = `${globalPct}%`;
            document.getElementById('globalStatsText').innerText = `Misión en curso: ${activeMissionName}`;
        }

        updateWidgetLive();
        setInterval(updateWidgetLive, 1000); // Refresco en tiempo real cada segundo
    </script>
</body>
</html>
