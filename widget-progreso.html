<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Barra de Progreso GTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .widget-container {
            width: 520px;
            background: rgba(18, 14, 28, 0.92);
            backdrop-filter: blur(10px);
            border: 2px solid #f5a623;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 0 30px rgba(245, 166, 35, 0.35);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        }
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .widget-header h3 {
            font-size: 0.95rem;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }
        #globalPctDisplay {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f5a623;
        }
        .global-bar-bg {
            background-color: #050408;
            height: 14px;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(245, 166, 35, 0.5);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .global-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5a623, #f43f5e, #00f0ff);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #f5a623;
        }
        #globalStatsText {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #fb7185;
            text-transform: uppercase;
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="widget-header">
            <h3>Progreso Saga GTA</h3>
            <span id="globalPctDisplay">0%</span>
        </div>
        <div class="global-bar-bg">
            <div id="globalBarFill" class="global-bar-fill"></div>
        </div>
        <p id="globalStatsText">Misión en curso: Conectando...</p>
    </div>

    <script>
        const TOTAL_MISSIONS = 287;
        const LOCAL_STORAGE_KEY = 'gta_stream_sync_state';

        function renderState(data) {
            if (!data) return;
            const completed = data.totalCompleted || 0;
            const pct = Math.min(100, Math.round((completed / TOTAL_MISSIONS) * 100));
            const missionName = data.activeMission || "Explorando la Saga";

            document.getElementById('globalPctDisplay').innerText = `${pct}%`;
            document.getElementById('globalBarFill').style.width = `${pct}%`;
            document.getElementById('globalStatsText').innerText = `Misión en curso: ${missionName}`;
        }

        // 1. Canal en tiempo real como las alertas (inter-proceso)
        const liveChannel = new BroadcastChannel('gta_live_tracker_channel');
        liveChannel.onmessage = (event) => {
            renderState(event.data);
        };

        // 2. Listener clásico de storage por si TikTok Studio usa iframe
        window.addEventListener('storage', (e) => {
            if (e.key === LOCAL_STORAGE_KEY && e.newValue) {
                try { renderState(JSON.parse(e.newValue)); } catch(err){}
            }
        });

        // 3. Chequeo inicial
        function init() {
            const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (raw) {
                try { renderState(JSON.parse(raw)); } catch(e){}
            } else {
                renderState({ totalCompleted: 0, activeMission: "En espera de inicio" });
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
