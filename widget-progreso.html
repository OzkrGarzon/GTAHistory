<script>
    const TOTAL_MISSIONS = 287;

    function render(data) {
        if (!data) return;
        const completed = data.totalCompleted || 0;
        const pct = Math.min(100, Math.round((completed / TOTAL_MISSIONS) * 100));
        const missionName = data.activeMission || "Explorando la Saga GTA";

        document.getElementById('globalPctDisplay').innerText = `${pct}%`;
        document.getElementById('globalBarFill').style.width = `${pct}%`;
        document.getElementById('globalStatsText').innerText = `Misión en curso: ${missionName}`;
    }

    async function pullCloudUpdate() {
        try {
            const res = await fetch('https://kvdb.io/4y9y2rNq5t5mP12ZJz8nE5/gta_ozkr_live?' + new Date().getTime());
            if (res.ok) {
                const data = await res.json();
                render(data);
            }
        } catch (e) {}
    }

    // Consulta en vivo continua cada 2 segundos
    setInterval(pullCloudUpdate, 2000);
    pullCloudUpdate();
</script>
