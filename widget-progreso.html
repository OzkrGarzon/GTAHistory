<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Barra de Progreso GTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Fondo transparente para OBS / TikTok Studio */
        body {
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .widget-container {
            width: 500px;
            background: rgba(18, 14, 28, 0.88);
            backdrop-filter: blur(10px);
            border: 2px solid #f5a623;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 0 25px rgba(245, 166, 35, 0.4);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .widget-header h3 {
            font-size: 1rem;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        #globalPctDisplay {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f5a623;
        }

        .global-bar-bg {
            background-color: #050408;
            height: 14px;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(245, 166, 35, 0.5);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .global-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5a623, #f43f5e, #00f0ff);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px #f5a623;
        }

        #globalStatsText {
            margin-top: 6px;
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Teko', sans-serif;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="widget-header">
            <h3>Progreso Saga GTA</h3>
            <span id="globalPctDisplay">0%</span>
        </div>
        <div class="global-bar-bg">
            <div id="globalBarFill" class="global-bar-fill"></div>
        </div>
        <p id="globalStatsText">Cargando progreso...</p>
    </div>

    <script>
        const expectedStoryTotals = { gtavc: 48, gtasa: 100, gta3: 51, gta4: 46, gta5: 42 };
        const absoluteTotalMissions = 287;

        async function fetchWidgetProgress() {
            let publicData = {};
            try {
                const response = await fetch('my-progress.json?' + new Date().getTime());
                if (response.ok) publicData = await response.json();
            } catch (e) {}

            let totalCompletedAllGames = 0;
            Object.keys(expectedStoryTotals).forEach(gameKey => {
                const gameData = publicData[gameKey] || {};
                const completed = Object.values(gameData).filter(task => task.done).length;
                totalCompletedAllGames += completed;
            });

            const globalPct = Math.min(100, Math.round((totalCompletedAllGames / absoluteTotalMissions) * 100));
            
            document.getElementById('globalPctDisplay').innerText = `${globalPct}%`;
            document.getElementById('globalBarFill').style.width = `${globalPct}%`;
            document.getElementById('globalStatsText').innerText = `${totalCompletedAllGames} / ${absoluteTotalMissions} Misiones completadas`;
        }

        // Se actualiza automáticamente cada 10 segundos por si editas el JSON mientras transmites
        fetchWidgetProgress();
        setInterval(fetchWidgetProgress, 10000);
    </script>
</body>
</html>
