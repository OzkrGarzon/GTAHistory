        /* ==========================================================================
           ZONA DE PERSONALIZACIÓN VISUAL (TUTORIAL RÁPIDO)
           ==========================================================================
           1. FONDO GLOBAL: Descomenta la línea 'background-image' en body y pon tu foto.
           2. BANNER HEADER: Descomenta la línea 'background-image' en header.
           3. LOGO: Cambia .header-logo a 'display: block;' y descomenta el <img> abajo.
           ========================================================================== */

        body {
            background-color: #0b0d14;
            /* background-image: linear-gradient(rgba(11, 13, 20, 0.90), rgba(11, 13, 20, 0.96)), url('fondo-vice-city.jpg'); */
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            color: #f3f4f6;
            padding-bottom: 70px;
        }

        header {
            background-color: #111424;
            /* background-image: linear-gradient(180deg, rgba(17, 20, 36, 0.75) 0%, rgba(11, 13, 20, 0.95) 100%), url('banner-vice-city.jpg'); */
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            border-bottom: 3px solid #ff49db;
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 60;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.65);
        }

        .header-logo {
            max-height: 48px;
            width: auto;
            display: none;
            object-fit: contain;
        }

        /* ==========================================================================
           ESTILOS DEL SISTEMA Y BASE DE DATOS
           ========================================================================== */
        :root {
            --bg-card: rgba(20, 24, 38, 0.88);
            --accent: #ff49db;
            --accent-cyan: #00f0ff;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --border: #262c45;
            --easy: #10b981;
            --medium: #3b82f6;
            --hard: #f97316;
            --extreme: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        .nav-bar {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .back-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: #fff; }

        main { max-width: 1300px; margin: 24px auto; padding: 0 20px; }

        /* Panel de Estadísticas Globales */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .progress-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .progress-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .progress-bar-bg { background: #080a10; height: 18px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent), var(--accent-cyan));
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Buscador / Filtro */
        .filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            background: #090b12;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }
        .search-input:focus { border-color: var(--accent); }

        /* Categorías y Misiones */
        .category-section { margin-top: 32px; }
        .category-title {
            font-size: 1.25rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            color: var(--accent-cyan);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .category-sub { font-size: 0.85rem; color: var(--text-dim); font-weight: normal; }

        .tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s, border-color 0.15s;
        }
        .task-card:hover { border-color: #434c70; transform: translateY(-2px); }
        .task-card.completed { border-color: rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.05); }

        .task-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
        .task-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-dim);
            border-radius: 4px;
            cursor: pointer;
            display: grid;
            place-content: center;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .task-checkbox:checked { background-color: var(--easy); border-color: var(--easy); }
        .task-checkbox:checked::before { content: "✓"; color: #fff; font-size: 14px; font-weight: 900; }

        .task-info { flex-grow: 1; cursor: pointer; }
        .task-name { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
        .task-character { font-size: 0.75rem; color: var(--accent); margin-top: 2px; }

        .task-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
            margin-top: 8px;
        }

        .difficulty { padding: 2px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
        .diff-facil { background: rgba(16, 185, 129, 0.2); color: var(--easy); }
        .diff-media { background: rgba(59, 130, 246, 0.2); color: var(--medium); }
        .diff-dificil { background: rgba(249, 115, 22, 0.2); color: var(--hard); }
        .diff-extrema { background: rgba(239, 68, 68, 0.2); color: var(--extreme); }

        .btn-modal {
            color: var(--accent-cyan);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
            font-size: 0.75rem;
        }

        /* Modal Relacional */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: #141724;
            border: 1px solid var(--border);
            max-width: 640px;
            width: 100%;
            border-radius: 12px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 14px; right: 16px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-badge-group { display: flex; gap: 8px; align-items: center; margin: 8px 0 14px 0; }
        .tag-meta { background: #080a12; border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: var(--text-dim); }

        .objectives-list {
            list-style: none;
            margin: 12px 0;
            background: #090b12;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .objectives-list li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: #d1d5db;
        }
        .objectives-list li::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--accent);
            font-weight: bold;
        }

        .video-box {
            margin-top: 14px;
            width: 100%;
            min-height: 200px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            overflow: hidden;

        .video-box iframe, .video-box video { width: 100%; height: 260px; }

        .input-group {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .input-group input {
            background: #08090e;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            color: #fff;
        }

        .btn-submit {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>

        let masterStore = {};
        let activeTaskId = null;
        let localVideoBlob = null;
        let currentFilter = "";

        function init() {
            const raw = localStorage.getItem('gta_master_save');
            if (raw) {
                try { masterStore = JSON.parse(raw); } catch(e) { masterStore = {}; }
            }
            if (!masterStore[GAME_ID]) masterStore[GAME_ID] = {};
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            const filteredTasks = tasks.filter(t => {
                const search = currentFilter.toLowerCase();
                return t.name.toLowerCase().includes(search) ||
                       t.cat.toLowerCase().includes(search) ||
                       t.desc.toLowerCase().includes(search) ||
                       (t.character && t.character.toLowerCase().includes(search));
            });

            const categories = [...new Set(filteredTasks.map(t => t.cat))];

            categories.forEach(cat => {
                const catTasks = filteredTasks.filter(t => t.cat === cat);
                const catDone = catTasks.filter(t => masterStore[GAME_ID][t.id] && masterStore[GAME_ID][t.id].done).length;

                const section = document.createElement('div');
                section.className = 'category-section';

                const headerWrap = document.createElement('div');
                headerWrap.className = 'category-title';
                headerWrap.innerHTML = `<span>${cat}</span><span class="category-sub">${catDone} / ${catTasks.length}</span>`;
                section.appendChild(headerWrap);

                const grid = document.createElement('div');
                grid.className = 'tasks-grid';

                catTasks.forEach(task => {
                    const status = masterStore[GAME_ID][task.id] || { done: false, video: null };
                    const card = document.createElement('div');
                    card.className = `task-card ${status.done ? 'completed' : ''}`;
                    card.innerHTML = `
                        <div class="task-top">
                            <input type="checkbox" class="task-checkbox" ${status.done ? 'checked' : ''} onchange="toggleDone('${task.id}', this.checked)">
                            <div class="task-info" onclick="openModal('${task.id}')">
                                <div class="task-name">${task.name}</div>
                                <div class="task-character">${task.character || 'Misión'}</div>
                            </div>
                        </div>
                        <div class="task-bottom">
                            <span class="difficulty diff-${task.diff}">${task.diff}</span>
                            <button class="btn-modal" onclick="openModal('${task.id}')">${status.video ? '📺 Ver Video' : '➕ Ficha / Video'}</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            calcProgress();
        }

        function handleSearch() {
            currentFilter = document.getElementById('searchInput').value;
            renderTasks();
        }

        function toggleDone(taskId, isChecked) {
            if (!masterStore[GAME_ID][taskId]) masterStore[GAME_ID][taskId] = {};
            masterStore[GAME_ID][taskId].done = isChecked;
            saveMaster();
            renderTasks();
        }

        function calcProgress() {
            const completed = tasks.filter(t => masterStore[GAME_ID][t.id] && masterStore[GAME_ID][t.id].done).length;
            const pct = Math.round((completed / tasks.length) * 100);

            document.getElementById('pctDisplay').innerText = `${pct}%`;
            document.getElementById('barDisplay').style.width = `${pct}%`;
            document.getElementById('statsText').innerText = `${completed} de ${tasks.length} tareas completadas para el 100%`;
        }

        function openModal(taskId) {
            activeTaskId = taskId;
            const task = tasks.find(t => t.id === taskId);
            const data = masterStore[GAME_ID][taskId] || {};

            document.getElementById('mName').innerText = task.name;
            document.getElementById('mCharacter').innerText = `Dador / Tipo: ${task.character || 'General'}`;
            document.getElementById('mDesc').innerText = task.desc;
            document.getElementById('mReward').innerText = `Recompensa: ${task.reward || '$0'}`;
            document.getElementById('mUnlock').innerText = `Desbloquea: ${task.unlocks || 'Progreso'}`;

            const diffElem = document.getElementById('mDiff');
            diffElem.className = `difficulty diff-${task.diff}`;
            diffElem.innerText = task.diff;

            // Renderizado de Objetivos Individuales
            const objList = document.getElementById('mObjectives');
            objList.innerHTML = '';
            if (task.objectives && task.objectives.length > 0) {
                task.objectives.forEach(obj => {
                    const li = document.createElement('li');
                    li.innerText = obj;
                    objList.appendChild(li);
                });
            } else {
                objList.innerHTML = '<li>Completar la misión con éxito.</li>';
            }

            document.getElementById('mUrl').value = (data.video && !data.video.startsWith('data:')) ? data.video : '';
            showVideo(data.video);

            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('mVideoViewer').innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>';
            localVideoBlob = null;
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    localVideoBlob = evt.target.result;
                    showVideo(localVideoBlob);
                };
                reader.readAsDataURL(file);
            }
        }

        function showVideo(src) {
            const box = document.getElementById('mVideoViewer');
            if (!src) {
                box.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>';
                return;
            }
            if (src.includes('youtube.com') || src.includes('youtu.be')) {
                let url = src.includes('watch?v=') ? src.replace('watch?v=', 'embed/') : src.replace('youtu.be/', 'www.youtube.com/embed/');
                box.innerHTML = `<iframe src="${url}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                box.innerHTML = `<video controls src="${src}"></video>`;
            }
        }

        function saveTaskMedia() {
            if (!masterStore[GAME_ID][activeTaskId]) masterStore[GAME_ID][activeTaskId] = { done: false };
            const inputUrl = document.getElementById('mUrl').value.trim();
            masterStore[GAME_ID][activeTaskId].video = localVideoBlob || inputUrl || null;

            saveMaster();
            closeModal();
            renderTasks();
        }

        function saveMaster() {
            localStorage.setItem('gta_master_save', JSON.stringify(masterStore));
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
