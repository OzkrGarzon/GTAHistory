<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Vice City - 100% Tracker</title>
    <style>
        :root {
            --bg-main: #0c0d14;
            --bg-card: #151824;
            --accent: #ff49db;
            --accent-cyan: #00f0ff;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --border: #262b40;
            --easy: #10b981;
            --medium: #3b82f6;
            --hard: #f97316;
            --extreme: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text); padding-bottom: 60px; }

        header {
            background: #111422;
            border-bottom: 2px solid var(--accent);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-bar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: #fff; }

        main { max-width: 1200px; margin: 24px auto; padding: 0 20px; }

        .progress-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .progress-bar-bg { background: #090a0f; height: 18px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent), var(--accent-cyan));
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .category-title {
            font-size: 1.25rem;
            margin: 32px 0 14px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            color: var(--accent-cyan);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .category-sub { font-size: 0.85rem; color: var(--text-dim); font-weight: normal; }

        .tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s, border-color 0.15s;
        }

        .task-card:hover { border-color: #3f4769; transform: translateY(-2px); }
        .task-card.completed { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.04); }

        .task-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
        .task-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-dim);
            border-radius: 4px;
            cursor: pointer;
            display: grid;
            place-content: center;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .task-checkbox:checked {
            background-color: var(--easy);
            border-color: var(--easy);
        }

        .task-checkbox:checked::before {
            content: "✓";
            color: #fff;
            font-size: 14px;
            font-weight: 900;
        }

        .task-info { flex-grow: 1; cursor: pointer; }
        .task-name { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }

        .task-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
            margin-top: 8px;
        }

        .difficulty { padding: 2px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
        .diff-facil { background: rgba(16, 185, 129, 0.2); color: var(--easy); }
        .diff-media { background: rgba(59, 130, 246, 0.2); color: var(--medium); }
        .diff-dificil { background: rgba(249, 115, 22, 0.2); color: var(--hard); }
        .diff-extrema { background: rgba(239, 68, 68, 0.2); color: var(--extreme); }

        .btn-modal {
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
            font-size: 0.75rem;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 600px;
            width: 100%;
            border-radius: 10px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 14px; right: 16px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .video-box {
            margin-top: 14px;
            width: 100%;
            min-height: 200px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            overflow: hidden;
        }

        .video-box iframe, .video-box video { width: 100%; height: 260px; }

        .input-group {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .input-group input {
            background: #08090e;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            color: #fff;
        }

        .btn-submit {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <div class="nav-bar">
            <a href="index.html" class="back-link">⬅ Volver al Menú Principal</a>
            <h2 style="font-size: 1.2rem; color: var(--accent);">GTA: Vice City - Checklist Oficial 100%</h2>
        </div>
    </header>

    <main>
        <section class="progress-card">
            <div class="progress-header">
                <h3>Progreso General de Vice City</h3>
                <span id="pctDisplay" style="font-size: 1.4rem; font-weight: 800; color: var(--accent);">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="barDisplay" class="progress-bar-fill"></div>
            </div>
            <p id="statsText" style="margin-top: 8px; font-size: 0.85rem; color: var(--text-dim);">0 de 0 misiones completadas</p>
        </section>

        <section id="tasksContainer"></section>
    </main>

    <!-- Modal Detalle / Multimedia -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="mName" style="margin-bottom: 6px;"></h2>
            <span id="mDiff" class="difficulty"></span>
            <p id="mDesc" style="margin-top: 14px; font-size: 0.95rem; line-height: 1.5; color: #d1d5db;"></p>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <h4>Video o Clip de la Misión</h4>
            <div class="input-group">
                <label>Enlace Web o YouTube:</label>
                <input type="text" id="mUrl" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <div class="input-group">
                <label>O cargar archivo local (mp4, webm):</label>
                <input type="file" id="mFile" accept="video/*" onchange="handleFile(event)">
            </div>
            <div class="video-box" id="mVideoViewer">
                <span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>
            </div>
            <button class="btn-submit" onclick="saveTaskMedia()">Guardar Evidencia</button>
        </div>
    </div>

        let masterStore = {};
        let activeTaskId = null;
        let localVideoBlob = null;

        function init() {
            const raw = localStorage.getItem('gta_master_save');
            if (raw) {
                try { masterStore = JSON.parse(raw); } catch(e) { masterStore = {}; }
            }
            if (!masterStore[GAME_ID]) masterStore[GAME_ID] = {};
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            const categories = [...new Set(tasks.map(t => t.cat))];

            categories.forEach(cat => {
                const catTasks = tasks.filter(t => t.cat === cat);
                const catDone = catTasks.filter(t => masterStore[GAME_ID][t.id] && masterStore[GAME_ID][t.id].done).length;

                const headerWrap = document.createElement('div');
                headerWrap.className = 'category-title';
                headerWrap.innerHTML = `<span>${cat}</span><span class="category-sub">${catDone} / ${catTasks.length}</span>`;
                container.appendChild(headerWrap);

                const grid = document.createElement('div');
                grid.className = 'tasks-grid';

                catTasks.forEach(task => {
                    const status = masterStore[GAME_ID][task.id] || { done: false, video: null };
                    const card = document.createElement('div');
                    card.className = `task-card ${status.done ? 'completed' : ''}`;
                    card.innerHTML = `
                        <div class="task-top">
                            <input type="checkbox" class="task-checkbox" ${status.done ? 'checked' : ''} onchange="toggleDone('${task.id}', this.checked)">
                            <div class="task-info" onclick="openModal('${task.id}')">
                                <div class="task-name">${task.name}</div>
                            </div>
                        </div>
                        <div class="task-bottom">
                            <span class="difficulty diff-${task.diff}">${task.diff}</span>
                            <button class="btn-modal" onclick="openModal('${task.id}')">${status.video ? '📺 Ver Video' : '➕ Video / Info'}</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                container.appendChild(grid);
            });

            calcProgress();
        }

        function toggleDone(taskId, isChecked) {
            if (!masterStore[GAME_ID][taskId]) masterStore[GAME_ID][taskId] = {};
            masterStore[GAME_ID][taskId].done = isChecked;
            saveMaster();
            renderTasks();
        }

        function calcProgress() {
            const completed = tasks.filter(t => masterStore[GAME_ID][t.id] && masterStore[GAME_ID][t.id].done).length;
            const pct = Math.round((completed / tasks.length) * 100);

            document.getElementById('pctDisplay').innerText = `${pct}%`;
            document.getElementById('barDisplay').style.width = `${pct}%`;
            document.getElementById('statsText').innerText = `${completed} de ${tasks.length} misiones completadas`;
        }

        function openModal(taskId) {
            activeTaskId = taskId;
            const task = tasks.find(t => t.id === taskId);
            const data = masterStore[GAME_ID][taskId] || {};

            document.getElementById('mName').innerText = task.name;
            document.getElementById('mDesc').innerText = task.desc;
            
            const diffElem = document.getElementById('mDiff');
            diffElem.className = `difficulty diff-${task.diff}`;
            diffElem.innerText = task.diff;

            document.getElementById('mUrl').value = (data.video && !data.video.startsWith('data:')) ? data.video : '';
            showVideo(data.video);

            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('mVideoViewer').innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>';
            localVideoBlob = null;
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    localVideoBlob = evt.target.result;
                    showVideo(localVideoBlob);
                };
                reader.readAsDataURL(file);
            }
        }

        function showVideo(src) {
            const box = document.getElementById('mVideoViewer');
            if (!src) {
                box.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>';
                return;
            }
            if (src.includes('youtube.com') || src.includes('youtu.be')) {
                let url = src.includes('watch?v=') ? src.replace('watch?v=', 'embed/') : src.replace('youtu.be/', 'www.youtube.com/embed/');
                box.innerHTML = `<iframe src="${url}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                box.innerHTML = `<video controls src="${src}"></video>`;
            }
        }

        function saveTaskMedia() {
            if (!masterStore[GAME_ID][activeTaskId]) masterStore[GAME_ID][activeTaskId] = { done: false };
            const inputUrl = document.getElementById('mUrl').value.trim();
            masterStore[GAME_ID][activeTaskId].video = localVideoBlob || inputUrl || null;

            saveMaster();
            closeModal();
            renderTasks();
        }

        function saveMaster() {
            localStorage.setItem('gta_master_save', JSON.stringify(masterStore));
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
