<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Vice City - Modo Espectador / Progreso Oficial</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --accent: #ff49db; }
        body {
            background-color: #0b0d14;
            background-image: linear-gradient(rgba(11, 13, 20, 0.90), rgba(11, 13, 20, 0.96)), url('fondovice.jpg');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            padding-bottom: 90px;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #ff49db, #00f0ff);
        }
    </style>
</head>
<body>

    <header class="hud-header">
        <div class="hud-nav">
            <a href="index.html" class="back-link">⬅ Menú Principal</a>
            <h2 style="font-family: 'Montserrat', sans-serif; font-size: 1.2rem; color: var(--accent); font-style: italic;">GTA: Vice City - Campaña Oficial</h2>
        </div>
    </header>

    <main style="max-width: 1300px; margin: 24px auto; padding: 0 20px;">
        <div class="dashboard">
            <section class="progress-card">
                <div class="progress-header">
                    <h3>Progreso del Creador (48 Misiones)</h3>
                    <span id="pctDisplay" style="font-size: 1.4rem; font-weight: 800; color: var(--accent);">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="barDisplay" class="progress-bar-fill"></div>
                </div>
                <p id="statsText" style="margin-top: 10px; font-size: 0.85rem; color: var(--text-dim);">Cargando misiones...</p>
            </section>

            <section class="filter-panel">
                <label style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: bold;">Buscar misión:</label>
                <input type="text" id="searchInput" class="search-input" placeholder="Ej: The Job, Cop Land..." oninput="handleSearch()">
            </section>
        </div>

        <section id="tasksContainer"></section>
    </main>

    <!-- Modal Espectador -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="mName" style="margin-bottom: 2px;"></h2>
            <div id="mCharacter" style="font-size: 0.85rem; color: var(--accent); font-weight: bold;"></div>

            <div class="modal-badge-group">
                <span id="mDiff" class="difficulty"></span>
                <span id="mReward" class="tag-meta"></span>
            </div>

            <p id="mDesc" style="font-size: 0.92rem; line-height: 1.5; color: #d1d5db;"></p>

            <h4 style="margin-top: 14px; font-size: 0.85rem; color: #00f0ff; text-transform: uppercase;">Objetivos Canónicos:</h4>
            <ul id="mObjectives" class="objectives-list"></ul>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <h4>Video de la Misión (Registrado por el Creador)</h4>
            <div class="video-box" id="mVideoViewer">
                <span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>
            </div>
        </div>
    </div>

    <!-- Reproductor Flotante -->
    <div class="music-player-widget">
        <audio id="bgMusic" loop preload="auto" src="gtasong.mp3"></audio>
        <button id="musicToggleBtn" class="music-btn" onclick="togglePlayMusic()">▶</button>
        <div class="music-info">
            <span>Banda Sonora</span>
            <span id="musicStatus">Pausado</span>
        </div>
    </div>

                const response = await fetch('my-progress.json?' + new Date().getTime());
                if (response.ok) {
                    publicProgress = await response.json();
                }
            } catch (e) {
                console.log("No se encontró archivo público externo.");
            }

            if (!publicProgress[GAME_ID]) publicProgress[GAME_ID] = {};
            renderTasks();
            setupMusicPersistence();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;
            container.innerHTML = '';

            const filteredTasks = tasks.filter(t => {
                const search = (currentFilter || "").toLowerCase();
                return t.name.toLowerCase().includes(search) ||
                       t.cat.toLowerCase().includes(search) ||
                       t.desc.toLowerCase().includes(search) ||
                       (t.character && t.character.toLowerCase().includes(search));
            });

            const categories = [...new Set(filteredTasks.map(t => t.cat))];

            categories.forEach(cat => {
                const catTasks = filteredTasks.filter(t => t.cat === cat);
                const catDone = catTasks.filter(t => publicProgress[GAME_ID][t.id] && publicProgress[GAME_ID][t.id].done).length;

                const section = document.createElement('div');
                section.className = 'category-section';

                const headerWrap = document.createElement('div');
                headerWrap.className = 'category-title';
                headerWrap.innerHTML = `<span>${cat}</span><span class="category-sub">${catDone} / ${catTasks.length}</span>`;
                section.appendChild(headerWrap);

                const grid = document.createElement('div');
                grid.className = 'tasks-grid';

                catTasks.forEach(task => {
                    const status = publicProgress[GAME_ID][task.id] || { done: false, video: null };
                    const card = document.createElement('div');
                    card.className = `task-card ${status.done ? 'completed' : ''}`;
                    
                    card.innerHTML = `
                        <div class="task-top">
                            <input type="checkbox" class="task-checkbox" ${status.done ? 'checked' : ''} disabled title="Progreso público de solo lectura">
                            <div class="task-info" onclick="openModal('${task.id}')">
                                <div class="task-name">${task.name}</div>
                                <div class="task-character">${task.character || 'Historia'}</div>
                            </div>
                        </div>
                        <div class="task-bottom">
                            <span class="difficulty diff-${task.diff}">${task.diff}</span>
                            <button class="btn-modal" onclick="openModal('${task.id}')">${status.video ? '📺 Ver Video' : 'ℹ️ Ficha'}</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            calcProgress();
            attachMenuSounds();
        }

        function handleSearch() {
            currentFilter = document.getElementById('searchInput').value;
            renderTasks();
        }

        function calcProgress() {
            const completed = tasks.filter(t => publicProgress[GAME_ID][t.id] && publicProgress[GAME_ID][t.id].done).length;
            const pct = Math.round((completed / tasks.length) * 100);

            document.getElementById('pctDisplay').innerText = `${pct}%`;
            document.getElementById('barDisplay').style.width = `${pct}%`;
            document.getElementById('statsText').innerText = `${completed} de ${tasks.length} misiones de historia completadas por el creador`;
        }

        function openModal(taskId) {
            activeTaskId = taskId;
            const task = tasks.find(t => t.id === taskId);
            const data = publicProgress[GAME_ID][taskId] || {};

            document.getElementById('mName').innerText = task.name;
            document.getElementById('mCharacter').innerText = `Contacto / Jefe: ${task.character}`;
            document.getElementById('mDesc').innerText = task.desc;
            document.getElementById('mReward').innerText = `Recompensa: ${task.reward}`;

            const diffElem = document.getElementById('mDiff');
            diffElem.className = `difficulty diff-${task.diff}`;
            diffElem.innerText = task.diff;

            const objList = document.getElementById('mObjectives');
            objList.innerHTML = '';
            if (task.objectives && task.objectives.length > 0) {
                task.objectives.forEach(obj => {
                    const li = document.createElement('li');
                    li.innerText = obj;
                    objList.appendChild(li);
                });
            } else {
                objList.innerHTML = '<li>Completar la misión con éxito.</li>';
            }

            const bgMusic = document.getElementById('bgMusic');
            if (data.video && bgMusic && !bgMusic.paused) {
                pauseMusic();
            }

            showVideo(data.video);
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('mVideoViewer').innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>';
        }

        function showVideo(src) {
            const box = document.getElementById('mVideoViewer');
            if (!src) {
                box.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">El creador aún no ha subido video para esta misión.</span>';
                return;
            }
            if (src.includes('youtube.com') || src.includes('youtu.be')) {
                let url = src.includes('watch?v=') ? src.replace('watch?v=', 'embed/') : src.replace('youtu.be/', 'www.youtube.com/embed/');
                box.innerHTML = `<iframe src="${url}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                box.innerHTML = `<video controls autoplay src="${src}"></video>`;
            }
        }

        const audio = document.getElementById('bgMusic');
        const btn = document.getElementById('musicToggleBtn');
        const status = document.getElementById('musicStatus');

        function setupMusicPersistence() {
            if (!audio) return;
            const savedTime = localStorage.getItem('gta_music_time');
            const isPlaying = localStorage.getItem('gta_music_playing') === 'true';

            if (savedTime) audio.currentTime = parseFloat(savedTime);

            if (isPlaying) {
                audio.volume = 0.35;
                audio.play().then(() => {
                    if (btn) btn.innerText = "⏸";
                    if (status) status.innerText = "Reproduciendo";
                }).catch(() => {
                    if (btn) btn.innerText = "▶";
                    if (status) status.innerText = "Pausado";
                });
            }

            audio.addEventListener('timeupdate', () => {
                localStorage.setItem('gta_music_time', audio.currentTime);
            });
        }

        function togglePlayMusic() {
            if (!audio) return;
            if (audio.paused) {
                audio.volume = 0.35;
                audio.play().then(() => {
                    btn.innerText = "⏸";
                    status.innerText = "Reproduciendo";
                    localStorage.setItem('gta_music_playing', 'true');
                }).catch(() => {
                    alert("Haz clic en la página para permitir la reproducción de audio.");
                });
            } else {
                pauseMusic();
            }
        }

        function pauseMusic() {
            if (!audio) return;
            audio.pause();
            if (btn) btn.innerText = "▶";
            if (status) status.innerText = "Pausado";
            localStorage.setItem('gta_music_playing', 'false');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
