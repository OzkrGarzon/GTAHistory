<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA IV - Modo Espectador / Progreso Oficial</title>
    <style>
        body {
            background-color: #0b0e14;
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            color: #f3f4f6;
            padding-bottom: 90px;
        }

        header {
            background-color: #121824;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            border-bottom: 3px solid #eab308;
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 60;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.65);
        }

        :root {
            --bg-card: rgba(18, 24, 38, 0.88);
            --accent: #eab308;
            --accent-glow: #facc15;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --border: #273046;
            --easy: #10b981;
            --medium: #3b82f6;
            --hard: #f97316;
            --extreme: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        .nav-bar {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: #fff; }

        main { max-width: 1300px; margin: 24px auto; padding: 0 20px; }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .progress-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .progress-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .progress-bar-bg { background: #07090f; height: 18px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent), #ef4444);
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            background: #090c14;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }
        .search-input:focus { border-color: var(--accent); }

        .category-section { margin-top: 32px; }
        .category-title {
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .category-sub { font-size: 0.85rem; color: var(--text-dim); font-weight: normal; }

        .tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s, border-color 0.15s;
        }
        .task-card:hover { border-color: #d97706; transform: translateY(-2px); }
        .task-card.completed { border-color: rgba(234, 179, 8, 0.5); background: rgba(234, 179, 8, 0.06); }

        .task-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
        .task-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-dim);
            border-radius: 4px;
            cursor: not-allowed;
            display: grid;
            place-content: center;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .task-checkbox:checked { background-color: var(--easy); border-color: var(--easy); }
        .task-checkbox:checked::before { content: "✓"; color: #fff; font-size: 14px; font-weight: 900; }

        .task-info { flex-grow: 1; cursor: pointer; }
        .task-name { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
        .task-character { font-size: 0.75rem; color: var(--accent); margin-top: 2px; }

        .task-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
            margin-top: 8px;
        }

        .difficulty { padding: 2px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
        .diff-facil { background: rgba(16, 185, 129, 0.2); color: var(--easy); }
        .diff-media { background: rgba(59, 130, 246, 0.2); color: var(--medium); }
        .diff-dificil { background: rgba(249, 115, 22, 0.2); color: var(--hard); }
        .diff-extrema { background: rgba(239, 68, 68, 0.2); color: var(--extreme); }

        .btn-modal {
            color: var(--accent);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
            font-size: 0.75rem;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: #131926;
            border: 1px solid var(--border);
            max-width: 640px;
            width: 100%;
            border-radius: 12px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 14px; right: 16px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-badge-group { display: flex; gap: 8px; align-items: center; margin: 8px 0 14px 0; }
        .tag-meta { background: #080b12; border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: var(--text-dim); }

        .objectives-list {
            list-style: none;
            margin: 12px 0;
            background: #080b12;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .objectives-list li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: #d1d5db;
        }
        .objectives-list li::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--accent);
            font-weight: bold;
        }

        .video-box {
            margin-top: 14px;
            width: 100%;
            min-height: 200px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            overflow: hidden;
        }
        .video-box iframe, .video-box video { width: 100%; height: 260px; }

        .music-player-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .music-btn {
            background: var(--accent);
            border: none;
            color: #000;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-content: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        .music-btn:hover { transform: scale(1.08); }

        .music-info {
            font-size: 0.78rem;
            color: var(--text);
            display: flex;
            flex-direction: column;
        }
        .music-info span:first-child { font-weight: bold; }
        .music-info span:last-child { color: var(--text-dim); font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <div class="nav-bar">
            <a href="index.html" class="back-link">⬅ Menú Principal</a>
            <div style="display: flex; align-items: center; gap: 12px;">
                <h2 style="font-size: 1.2rem; color: var(--accent);">GTA IV - Modo Espectador</h2>
            </div>
        </div>
    </header>

    <main>
        <div class="dashboard">
            <section class="progress-card">
                <div class="progress-header">
                    <h3>Progreso del Creador (46 Misiones)</h3>
                    <span id="pctDisplay" style="font-size: 1.4rem; font-weight: 800; color: var(--accent);">0%</span>

                <div class="progress-bar-bg">
                    <div id="barDisplay" class="progress-bar-fill"></div>
                </div>

            </section>

            <section class="filter-panel">
                <label style="font-size: 0.8rem; color: var(--text-dim);">Buscar misión:</label>
                <input type="text" id="searchInput" class="search-input" placeholder="Ej: Three Leaf Clover, Museum Piece..." oninput="handleSearch()">
            </section>
        </div>

        <section id="tasksContainer"></section>

    <!-- Modal Espectador -->
    <div id="taskModal" class="modal">

            <h2 id="mName" style="margin-bottom: 2px;"></h2>
            <div id="mCharacter" style="font-size: 0.85rem; color: var(--accent); font-weight: bold;"></div>

            <div class="modal-badge-group">

            <p id="mDesc" style="font-size: 0.92rem; line-height: 1.5; color: #d1d5db;"></p>

            <h4 style="margin-top: 14px; font-size: 0.85rem; color: var(--accent); text-transform: uppercase;">Objetivos Canónicos:</h4>
            <ul id="mObjectives" class="objectives-list"></ul>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <h4>Video de la Misión (Registrado por el Creador)</h4>
            <div class="video-box" id="mVideoViewer">
                <span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>
            </div>
        </div>
    </div>

    <!-- Reproductor Flotante -->
    <div class="music-player-widget">
        <audio id="bgMusic" loop preload="auto" src="https://raw.githubusercontent.com/OzkrGarzon/GTAHistory/main/gtasong.mp3"></audio>
        <button id="musicToggleBtn" class="music-btn" onclick="togglePlayMusic()">▶</button>
        <div class="music-info">
            <span>Banda Sonora</span>
            <span id="musicStatus">Pausado</span>
        </div>
    </div>

            { id: "g4_33", cat: "3. Algonquin", character: "Derrick McReary", name: "33. I'll Take Her", diff: "media", reward: "$13,000", desc: "Secuestro de la hija de un magnate en Algonquin.", objectives: ["Robar su coche deportivo y llevarla al escondite"] },
            { id: "g4_34", cat: "3. Algonquin", character: "Derrick McReary", name: "34. Union Drive", diff: "media", reward: "$14,000", desc: "Persecución urbana contra chantajistas sindicales.", objectives: ["Perseguir y eliminar a los chantajistas por las calles de Algonquin"] },
            { id: "g4_35", cat: "3. Algonquin", character: "Gerry McReary", name: "35. Smackdown (Gerry)", diff: "media", reward: "$15,000", desc: "Trabajos sucios encomendados desde la cárcel por Gerry.", objectives: ["Eliminar objetivos designados"] },
            { id: "g4_36", cat: "3. Algonquin", character: "Bernie Crane", name: "36. Hating the Haters", diff: "facil", reward: "$5,000", desc: "Protección a Floydd/Bernie de acosadores homófobos en Central Park.", objectives: ["Seguir al acosador y eliminarlo discretamente"] },
            { id: "g4_37", cat: "3. Algonquin", character: "Bernie Crane", name: "37. Union Drive (Bernie)", diff: "media", reward: "$6,000", desc: "Paseo en coche protegido por Bernie en su deportivo clásico.", objectives: ["Conducir protegiendo el coche de Bernie de los rusos"] },
            { id: "g4_38", cat: "4. El Triunfo Final", character: "Jimmy Pegorino", name: "38. Pegorino's Pride", diff: "dificil", reward: "$16,000", desc: "Trato de drogas con los coreanos en un restaurante italiano que termina en tiroteo.", objectives: ["Proteger a Pegorino y escapar del asedio coreano"] },
            { id: "g4_39", cat: "4. El Triunfo Final", character: "Jimmy Pegorino", name: "39. Payback", diff: "media", reward: "$17,000", desc: "Venganza contra los traidores de la familia Pegorino.", objectives: ["Localizar y eliminar a los miembros desleales"] },
            { id: "g4_40", cat: "4. El Triunfo Final", character: "Jimmy Pegorino", name: "40. Catch the Wave", diff: "media", reward: "$18,000", desc: "Asalto a los barcos de los coreanos cargados de droga.", objectives: ["Robar un carguero en los muelles y escapar"] },
            { id: "g4_41", cat: "4. El Triunfo Final", character: "Phil Bell", name: "41. Tres Chic", diff: "facil", reward: "$19,000", desc: "Preparación de un atentado con bomba en un club elegante.", objectives: ["Colocar explosivos discretamente"] },
            { id: "g4_42", cat: "4. El Triunfo Final", character: "Phil Bell", name: "42. Entourage", diff: "dificil", reward: "$20,000", desc: "Rescate y escolta de un diplomático corrupto en Algonquin.", objectives: ["Despejar las emboscadas de la mafia rival y llevar al diplomático a salvo"] },
            { id: "g4_43", cat: "4. El Triunfo Final", character: "Phil Bell", name: "43. Dining Out", diff: "dificil", reward: "$21,000", desc: "Asalto a un restaurante italiano en Little Italy para cobrar cuentas pendientes.", objectives: ["Entrar a tiros al restaurante, interrogar al dueño y huir por las cocinas"] },
            { id: "g4_44", cat: "4. El Triunfo Final", character: "Phil Bell", name: "44. Liquidize the Assets", diff: "dificil", reward: "$22,000", desc: "Destrucción total de los camiones de contrabando de los apostadores.", objectives: ["Asaltar el depósito de camiones en Acter Industrial Park y destruirlos todos con granadas"] },
            { id: "g4_45", cat: "4. El Triunfo Final", character: "Jon Gravelli", name: "45. That Special Someone", diff: "media", reward: "$25,000", desc: "Encuentro y decisión final sobre Darko Brevic, el traidor que delató a Niko en la guerra.", objectives: ["Recoger a Darko en el aeropuerto", "Llevarlo a un descampado y decidir si perdonarle la vida o ejecutarlo"] },
            { id: "g4_46", cat: "4. El Triunfo Final", character: "Dimitri / Deal or Revenge", name: "46. One Last Thing (Decisión Final)", diff: "extrema", reward: "Elección de Ruta", desc: "El dilema definitivo: Aceptar hacer negocios con Dimitri (Dinero) o buscar venganza (Venganza).", objectives: ["Elegir entre el maletín de dinero de Dimitri o la venganza a sangre fría"] }
        ];

        let publicProgress = {};
        let activeTaskId = null;
        let currentFilter = "";

        async function init() {
            try {
                const response = await fetch('my-progress.json?' + new Date().getTime());
                if (response.ok) {
                    publicProgress = await response.json();
                }
            } catch (e) {
                console.log("No se encontró archivo público externo.");
            }

            if (!publicProgress[GAME_ID]) publicProgress[GAME_ID] = {};
            renderTasks();
            setupMusicPersistence();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;
            container.innerHTML = '';

            const filteredTasks = tasks.filter(t => {
                const search = (currentFilter || "").toLowerCase();
                return t.name.toLowerCase().includes(search) ||
                       t.cat.toLowerCase().includes(search) ||
                       t.desc.toLowerCase().includes(search) ||
                       (t.character && t.character.toLowerCase().includes(search));
            });

            const categories = [...new Set(filteredTasks.map(t => t.cat))];

            categories.forEach(cat => {
                const catTasks = filteredTasks.filter(t => t.cat === cat);
                const catDone = catTasks.filter(t => publicProgress[GAME_ID][t.id] && publicProgress[GAME_ID][t.id].done).length;

                const section = document.createElement('div');
                section.className = 'category-section';

                const headerWrap = document.createElement('div');
                headerWrap.className = 'category-title';
                headerWrap.innerHTML = `<span>${cat}</span><span class="category-sub">${catDone} / ${catTasks.length}</span>`;
                section.appendChild(headerWrap);

                const grid = document.createElement('div');
                grid.className = 'tasks-grid';

                catTasks.forEach(task => {
                    const status = publicProgress[GAME_ID][task.id] || { done: false, video: null };
                    const card = document.createElement('div');
                    card.className = `task-card ${status.done ? 'completed' : ''}`;
                    
                    card.innerHTML = `
                        <div class="task-top">
                            <input type="checkbox" class="task-checkbox" ${status.done ? 'checked' : ''} disabled title="Progreso público de solo lectura">
                            <div class="task-info" onclick="openModal('${task.id}')">
                                <div class="task-name">${task.name}</div>
                                <div class="task-character">${task.character || 'Historia'}</div>
                            </div>
                        </div>
                        <div class="task-bottom">
                            <span class="difficulty diff-${task.diff}">${task.diff}</span>
                            <button class="btn-modal" onclick="openModal('${task.id}')">${status.video ? '📺 Ver Video' : 'ℹ️ Ficha'}</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            calcProgress();
            attachMenuSounds();
        }

        function handleSearch() {
            currentFilter = document.getElementById('searchInput').value;
            renderTasks();
        }

        function calcProgress() {
            const completed = tasks.filter(t => publicProgress[GAME_ID][t.id] && publicProgress[GAME_ID][t.id].done).length;
            const pct = Math.round((completed / tasks.length) * 100);

            document.getElementById('pctDisplay').innerText = `${pct}%`;
            document.getElementById('barDisplay').style.width = `${pct}%`;
            document.getElementById('statsText').innerText = `${completed} de ${tasks.length} misiones de historia completadas por el creador`;
        }

        function openModal(taskId) {
            activeTaskId = taskId;
            const task = tasks.find(t => t.id === taskId);
            const data = publicProgress[GAME_ID][taskId] || {};

            document.getElementById('mName').innerText = task.name;
            document.getElementById('mCharacter').innerText = `Contacto / Jefe: ${task.character}`;
            document.getElementById('mDesc').innerText = task.desc;
            document.getElementById('mReward').innerText = `Recompensa: ${task.reward}`;

            const diffElem = document.getElementById('mDiff');
            diffElem.className = `difficulty diff-${task.diff}`;
            diffElem.innerText = task.diff;

            const objList = document.getElementById('mObjectives');
            objList.innerHTML = '';
            if (task.objectives && task.objectives.length > 0) {
                task.objectives.forEach(obj => {
                    const li = document.createElement('li');
                    li.innerText = obj;
                    objList.appendChild(li);
                });
            } else {
                objList.innerHTML = '<li>Completar la misión con éxito.</li>';
            }

            const bgMusic = document.getElementById('bgMusic');
            if (data.video && bgMusic && !bgMusic.paused) {
                pauseMusic();
            }

            showVideo(data.video);
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('mVideoViewer').innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>';
        }

        function showVideo(src) {
            const box = document.getElementById('mVideoViewer');
            if (!src) {
                box.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">El creador aún no ha subido video para esta misión.</span>';
                return;
            }
            if (src.includes('youtube.com') || src.includes('youtu.be')) {
                let url = src.includes('watch?v=') ? src.replace('watch?v=', 'embed/') : src.replace('youtu.be/', 'www.youtube.com/embed/');
                box.innerHTML = `<iframe src="${url}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                box.innerHTML = `<video controls autoplay src="${src}"></video>`;
            }
        }

        const audio = document.getElementById('bgMusic');
        const btn = document.getElementById('musicToggleBtn');
        const status = document.getElementById('musicStatus');

        function setupMusicPersistence() {
            if (!audio) return;
            const savedTime = localStorage.getItem('gta_music_time');
            const isPlaying = localStorage.getItem('gta_music_playing') === 'true';

            if (savedTime) audio.currentTime = parseFloat(savedTime);

            if (isPlaying) {
                audio.volume = 0.35;
                audio.play().then(() => {
                    if (btn) btn.innerText = "⏸";
                    if (status) status.innerText = "Reproduciendo";
                }).catch(() => {
                    if (btn) btn.innerText = "▶";
                    if (status) status.innerText = "Pausado";
                });
            }

            audio.addEventListener('timeupdate', () => {
                localStorage.setItem('gta_music_time', audio.currentTime);
            });
        }

        function togglePlayMusic() {
            if (!audio) return;
            if (audio.paused) {
                audio.volume = 0.35;
                audio.play().then(() => {
                    btn.innerText = "⏸";
                    status.innerText = "Reproduciendo";
                    localStorage.setItem('gta_music_playing', 'true');
                }).catch(() => {
                    alert("Haz clic en la página para permitir la reproducción de audio.");
                });
            } else {
                pauseMusic();
            }
        }

        function pauseMusic() {
            if (!audio) return;
            audio.pause();
            if (btn) btn.innerText = "▶";
            if (status) status.innerText = "Pausado";
            localStorage.setItem('gta_music_playing', 'false');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
