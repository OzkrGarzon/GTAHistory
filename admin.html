    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #08060c; color: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; padding: 30px 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: rgba(18, 14, 28, 0.95); border: 2px solid #f43f5e; border-radius: 14px; padding: 30px; box-shadow: 0 0 40px rgba(244, 63, 94, 0.3); }
        h1 { font-family: 'Montserrat', sans-serif; font-style: italic; text-transform: uppercase; font-size: 1.8rem; color: #f43f5e; margin-bottom: 12px; letter-spacing: 2px; }
        .status-sync { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 20px; background: #064e3b; color: #34d399; }
        .control-group { margin-bottom: 20px; background: rgba(10, 6, 16, 0.8); padding: 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        label { display: block; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #fb7185; margin-bottom: 8px; font-weight: bold; }
        select { width: 100%; background: #050408; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 6px; font-size: 1rem; outline: none; }
        .missions-list { max-height: 380px; overflow-y: auto; background: #050408; padding: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        .mission-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 15px; }
        .mission-name { font-size: 0.92rem; font-weight: 600; color: #fff; flex-grow: 1; }
        .action-btns { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-status { padding: 6px 12px; border: 1px solid rgba(255,255,255,0.2); background: #110d1c; color: #9ca3af; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; border-radius: 4px; cursor: pointer; }
        .btn-status.done-active { background: #10b981; border-color: #10b981; color: #000; }

        let liveState = {
            missions: {},
            activeMission: "Explorando la Saga GTA",
            totalCompleted: 0
        };

        async function init() {
            const local = localStorage.getItem("gta_state_store");
            if (local) {
                try { liveState = JSON.parse(local); } catch(e){}
            }
            loadGameMissions();
        }

        function loadGameMissions() {
            const gameKey = document.getElementById('gameSelector').value;
            const container = document.getElementById('missionsListContainer');
            container.innerHTML = '';

            if (!liveState.missions[gameKey]) liveState.missions[gameKey] = {};

            gameCatalogs[gameKey].forEach(task => {
                const item = liveState.missions[gameKey][task.id] || { done: false, inProgress: false };
                const row = document.createElement('div');
                row.className = 'mission-row';
                row.innerHTML = `
                    <span class="mission-name">${task.name}</span>
                    <div class="action-btns">
                        <button type="button" class="btn-status ${item.inProgress ? 'progress-active' : ''}" onclick="setStatus('${gameKey}', '${task.id}', '${task.name}', 'progress')">En curso</button>
                        <button type="button" class="btn-status ${item.done ? 'done-active' : ''}" onclick="setStatus('${gameKey}', '${task.id}', '${task.name}', 'done')">Completado</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function setStatus(gameKey, taskId, taskName, type) {
            if (!liveState.missions[gameKey]) liveState.missions[gameKey] = {};
            if (!liveState.missions[gameKey][taskId]) liveState.missions[gameKey][taskId] = { done: false, inProgress: false };

            const t = liveState.missions[gameKey][taskId];

            if (type === 'done') {
                t.done = !t.done;
                if (t.done) t.inProgress = false;
            } else if (type === 'progress') {
                const willBe = !t.inProgress;
                Object.keys(liveState.missions).forEach(g => {
                    Object.keys(liveState.missions[g]).forEach(id => {
                        liveState.missions[g][id].inProgress = false;
                    });
                });
                t.inProgress = willBe;
                liveState.activeMission = willBe ? taskName : "Explorando la Saga GTA";
            }

            let count = 0;
            Object.keys(liveState.missions).forEach(g => {
                Object.values(liveState.missions[g]).forEach(obj => {
                    if (obj.done) count++;
                });
            });
            liveState.totalCompleted = count;

            localStorage.setItem("gta_state_store", JSON.stringify(liveState));
            loadGameMissions();

            try {
                await fetch('https://kvdb.io/4y9y2rNq5t5mP12ZJz8nE5/gta_ozkr_live', {
                    method: 'POST',
                    body: JSON.stringify(liveState)
                });
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', init);
