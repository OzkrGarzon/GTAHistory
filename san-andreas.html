<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA San Andreas - Modo Espectador / Progreso Oficial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Teko:wght@600;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #22c55e;
            --accent-gold: #eab308;
            --gta-dark: #080c09;
            --bg-card: rgba(18, 26, 20, 0.92);
            --bg-card-hover: rgba(26, 38, 28, 0.96);
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --border: rgba(34, 197, 94, 0.25);
            --easy: #10b981;
            --medium: #3b82f6;
            --hard: #f97316;
            --extreme: #ef4444;
        }

        body {
            background-color: var(--gta-dark);
            background-image: linear-gradient(rgba(8, 12, 9, 0.90), rgba(8, 12, 9, 0.96)), url('cover-san-andreas.jpg');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 90px;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanlines CRT */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.12),
                rgba(0, 0, 0, 0.12) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 99;
        }

        header {
            background-color: rgba(14, 23, 16, 0.94);
            backdrop-filter: blur(14px);
            border-bottom: 3px solid var(--accent);
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 60;
            box-shadow: 0 4px 25px rgba(34, 197, 94, 0.35);
        }

        .nav-bar {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .back-link:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--accent-gold);
            transform: translateX(-3px);
        }

        .header-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            color: var(--accent);
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }

        main {
            max-width: 1300px;
            margin: 28px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .progress-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 22px;
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }
        .progress-header h3 {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .progress-bar-bg {
            background: #050806;
            height: 16px;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(34, 197, 94, 0.4);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 15px var(--accent);
        }

        .filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
        }

        .search-input {
            width: 100%;
            background: #090e0a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 4px;
            outline: none;
            font-size: 0.95rem;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
        }

        .category-section { margin-top: 34px; }
        .category-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 6px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            text-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }
        .category-sub {
            font-family: 'Teko', sans-serif;
            font-size: 1.35rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 16px;
        }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .task-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.25);
            background-color: var(--bg-card-hover);
        }
        .task-card.completed {
            border-left: 5px solid var(--easy);
            background: rgba(34, 197, 94, 0.08);
        }

        .task-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
        .task-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-dim);
            border-radius: 4px;
            cursor: not-allowed;
            display: grid;
            place-content: center;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .task-checkbox:checked { background-color: var(--easy); border-color: var(--easy); }
        .task-checkbox:checked::before { content: "✓"; color: #fff; font-size: 14px; font-weight: 900; }

        .task-info { flex-grow: 1; cursor: pointer; }
        .task-name { font-weight: 800; font-size: 0.98rem; line-height: 1.3; }
        .task-character { font-size: 0.76rem; color: var(--accent-gold); margin-top: 3px; font-weight: 700; text-transform: uppercase; }

        .task-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 8px;
            margin-top: 8px;
        }

        .difficulty { padding: 2px 8px; border-radius: 4px; font-weight: 800; text-transform: uppercase; font-size: 0.7rem; }
        .diff-facil { background: rgba(16, 185, 129, 0.2); color: var(--easy); }
        .diff-media { background: rgba(59, 130, 246, 0.2); color: var(--medium); }
        .diff-dificil { background: rgba(249, 115, 22, 0.2); color: var(--hard); }
        .diff-extrema { background: rgba(239, 68, 68, 0.2); color: var(--extreme); }

        .btn-modal {
            color: var(--accent-gold);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
            text-decoration: underline;
            font-size: 0.78rem;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: #111a13;
            border: 2px solid var(--accent);
            max-width: 660px;
            width: 100%;
            border-radius: 12px;
            padding: 26px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.4);
        }

        .modal-close {
            position: absolute;
            top: 14px; right: 16px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .modal-badge-group { display: flex; gap: 8px; align-items: center; margin: 10px 0 14px; }
        .tag-meta { background: #080d09; border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: var(--text-dim); }

        .objectives-list {
            list-style: none;
            margin: 12px 0;
            background: #070c08;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .objectives-list li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 6px;
            font-size: 0.88rem;
            color: #d1d5db;
        }
        .objectives-list li::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--accent);
            font-weight: bold;
        }

        .video-box {
            margin-top: 14px;
            width: 100%;
            min-height: 220px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .video-box iframe, .video-box video { width: 100%; height: 280px; }

        /* Reproductor de Música */
        .music-player-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(14, 23, 16, 0.95);
            backdrop-filter: blur(14px);
            border: 2px solid var(--accent);
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 6px 28px rgba(34, 197, 94, 0.4);
            z-index: 100;
        }

        .music-btn {
            background: linear-gradient(135deg, var(--accent), #15803d);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-content: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.6);
            transition: transform 0.2s;
        }
        .music-btn:hover { transform: scale(1.1); }

        .music-info {
            font-size: 0.8rem;
            color: var(--text);
            display: flex;
            flex-direction: column;
        }
        .music-info span:first-child { font-weight: 800; text-transform: uppercase; }
        .music-info span:last-child { color: var(--accent-gold); font-size: 0.72rem; font-family: 'Teko', sans-serif; letter-spacing: 1.5px; }
    </style>
</head>
<body>

    <header>
        <div class="nav-bar">
            <a href="index.html" class="back-link">⬅ Menú Principal</a>
            <h2 class="header-title">GTA: San Andreas - Campaña Oficial</h2>
        </div>
    </header>

    <main>
        <div class="dashboard">
            <section class="progress-card">
                <div class="progress-header">
                    <h3>Progreso del Creador (100 Misiones)</h3>
                    <span id="pctDisplay" style="font-size: 1.4rem; font-weight: 800; color: var(--accent);">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="barDisplay" class="progress-bar-fill"></div>
                </div>
                <p id="statsText" style="margin-top: 10px; font-size: 0.85rem; color: var(--text-dim);">Cargando misiones...</p>
            </section>

            <section class="filter-panel">
                <label style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: bold;">Buscar misión:</label>
                <input type="text" id="searchInput" class="search-input" placeholder="Ej: Wrong Side, Ryder, End of the Line..." oninput="handleSearch()">
            </section>
        </div>

        <section id="tasksContainer"></section>
    </main>

    <!-- Modal Espectador -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="mName" style="margin-bottom: 2px;"></h2>
            <div id="mCharacter" style="font-size: 0.85rem; color: var(--accent-gold); font-weight: bold;"></div>

            <div class="modal-badge-group">
                <span id="mDiff" class="difficulty"></span>
                <span id="mReward" class="tag-meta"></span>
            </div>

            <p id="mDesc" style="font-size: 0.92rem; line-height: 1.5; color: #d1d5db;"></p>

            <h4 style="margin-top: 14px; font-size: 0.85rem; color: var(--accent); text-transform: uppercase;">Objetivos Canónicos:</h4>
            <ul id="mObjectives" class="objectives-list"></ul>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <h4>Video de la Misión (Registrado por el Creador)</h4>
            <div class="video-box" id="mVideoViewer">
                <span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>
            </div>
        </div>
    </div>

    <!-- Reproductor Flotante -->
    <div class="music-player-widget">
        <audio id="bgMusic" loop preload="auto" src="gtasong.mp3"></audio>
        <button id="musicToggleBtn" class="music-btn" onclick="togglePlayMusic()">▶</button>
        <div class="music-info">
            <span>Banda Sonora</span>
            <span id="musicStatus">Pausado</span>
        </div>
    </div>

    <script>

        hoverSound.volume = 0.25;

        function playMenuHover() {
            try {
                hoverSound.currentTime = 0;
                hoverSound.play().catch(() => {});
            } catch (e) {}
        }

        function attachMenuSounds() {
            const targets = document.querySelectorAll('.task-card, .btn-modal, .back-link, .music-btn, .modal-close');
            targets.forEach(el => {
                el.removeEventListener('mouseenter', playMenuHover);
                el.addEventListener('mouseenter', playMenuHover);
            });
        }

        const tasks = [
            { id: "sa_01", cat: "1. Los Santos - Inicios", character: "Prólogo", name: "1. In the Beginning", diff: "facil", reward: "$0", desc: "Regreso de Carl Johnson a Los Santos tras cinco años en Liberty City y extorsión del C.R.A.S.H.", objectives: ["Ver la cinemática en el callejón de Jefferson", "Montar en la bicicleta BMX señalada", "Pedalear hasta la casa de los Johnson en Grove Street"] },
            { id: "sa_02", cat: "1. Los Santos - Inicios", character: "Big Smoke", name: "2. Big Smoke", diff: "facil", reward: "Respeto +", desc: "Reencuentro familiar con Sweet, Kendl y Big Smoke antes de la emboscada en el cementerio.", objectives: ["Entrar a la casa materna", "Conducir con Sweet, Smoke y Ryder al cementerio", "Escapar en bicicleta del coche de los Ballas"] },
            { id: "sa_03", cat: "1. Los Santos - Inicios", character: "Sweet", name: "3. Ryder", diff: "facil", reward: "Respeto +", desc: "Visita al barbero local y robo frustrado en la pizzería con Ryder.", objectives: ["Conducir con Ryder a Idlewood", "Cambiarse el corte de pelo en la barbería de Old Reece", "Comer en Well Stacked Pizza", "Escapar de la escopeta del dependiente"] },
            { id: "sa_04", cat: "1. Los Santos - Inicios", character: "Sweet", name: "4. Tagging Up Turf", diff: "facil", reward: "$200 / Respeto +", desc: "Marcado de graffitis de Grove Street Families sobre las marcas de los Ballas.", objectives: ["Pintar los dos graffitis en Idlewood", "Pintar los graffitis en territorio de los Ballas", "Escapar por los tejados y volver a Grove Street"] },
            { id: "sa_05", cat: "1. Los Santos - Inicios", character: "Sweet", name: "5. Cleaning the Hood", diff: "facil", reward: "Respeto +", desc: "Limpieza de camellos de crack en el barrio y visita a B-Dup.", objectives: ["Ir a la casa de B-Dup con Ryder", "Golpear al camello con el bate de béisbol", "Asaltar el picadero de crack y liquidar a los adictos armados"] },
            { id: "sa_06", cat: "1. Los Santos - Inicios", character: "Sweet", name: "6. Drive-Thru", diff: "facil", reward: "$200 / Respeto +", desc: "Almuerzo en Cluckin' Bell interrumpido por un coche de ataque de los Ballas.", objectives: ["Conducir al Cluckin' Bell de Willowfield", "Perseguir el Voodoo de los Ballas mientras los chicos disparan", "Destruir el vehículo rival antes de que lleguen a Grove Street"] },
            { id: "sa_07", cat: "1. Los Santos - Inicios", character: "Sweet", name: "7. Nines and AK's", diff: "facil", reward: "Respeto +", desc: "Práctica de tiro con Emmet y compra de ropa verde de la banda.", objectives: ["Ir al almacén de Emmet con Big Smoke", "Disparar a las botellas y al depósito del coche", "Llevar a Smoke a su casa", "Comprar ropa verde en Binco"] },
            { id: "sa_08", cat: "1. Los Santos - Inicios", character: "Sweet", name: "8. Drive-By", diff: "media", reward: "$500 / Respeto +", desc: "Ataques en movimiento en territorio de los Ballas con el Greenwood.", objectives: ["Conducir con Sweet, Smoke y Ryder al territorio enemigo", "Eliminar a cuatro grupos de Ballas en tiroteo desde el coche", "Perder las 2 estrellas en el Pay 'n' Spray"] },
            { id: "sa_09", cat: "1. Los Santos - Inicios", character: "Sweet", name: "9. Sweet's Girl", diff: "media", reward: "Respeto +", desc: "Rescate de Sweet acorralado en la casa de su novia por los Seville Boulevard Families.", objectives: ["Conducir urgentemente antes de que baje la barra de salud de Sweet", "Atropellar o abatir a los pandilleros en la entrada", "Recoger a Sweet y a su chica y escapar"] },
            { id: "sa_10", cat: "1. Los Santos - Inicios", character: "Sweet", name: "10. Cesar Vialpando", diff: "media", reward: "Apuesta monetaria", desc: "Concurso de suspensión hidráulica Lowrider para conocer al novio de Kendl.", objectives: ["Modificar un Blade en Loco Low Co.", "Ir a la estación de Unity Station", "Seguir el ritmo de las flechas con la suspensión hidráulica y superar la puntuación"] },

            { id: "sa_15", cat: "2. Los Santos - Consolidación", character: "Big Smoke", name: "15. Running Dog", diff: "facil", reward: "Respeto +", desc: "Reunión con los primos mexicanos de Smoke que termina en persecución a pie.", objectives: ["Conducir con Smoke a la reunión en East Los Santos", "Perseguir al camello de los Vagos por los patios traseros", "Liquidar al objetivo antes de que escape"] },

        let publicProgress = {};
        let activeTaskId = null;
        let currentFilter = "";

        async function init() {
            try {
                const response = await fetch('my-progress.json?' + new Date().getTime());
                if (response.ok) {
                    publicProgress = await response.json();
                }
            } catch (e) {
                console.log("No se encontró archivo público externo.");
            }

            if (!publicProgress[GAME_ID]) publicProgress[GAME_ID] = {};
            renderTasks();
            setupMusicPersistence();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            if (!container) return;
            container.innerHTML = '';

            const filteredTasks = tasks.filter(t => {
                const search = (currentFilter || "").toLowerCase();
                return t.name.toLowerCase().includes(search) ||
                       t.cat.toLowerCase().includes(search) ||
                       t.desc.toLowerCase().includes(search) ||
                       (t.character && t.character.toLowerCase().includes(search));
            });

            const categories = [...new Set(filteredTasks.map(t => t.cat))];

            categories.forEach(cat => {
                const catTasks = filteredTasks.filter(t => t.cat === cat);
                const catDone = catTasks.filter(t => publicProgress[GAME_ID][t.id] && publicProgress[GAME_ID][t.id].done).length;

                const section = document.createElement('div');
                section.className = 'category-section';

                const headerWrap = document.createElement('div');
                headerWrap.className = 'category-title';
                headerWrap.innerHTML = `<span>${cat}</span><span class="category-sub">${catDone} / ${catTasks.length}</span>`;
                section.appendChild(headerWrap);

                const grid = document.createElement('div');
                grid.className = 'tasks-grid';

                catTasks.forEach(task => {
                    const status = publicProgress[GAME_ID][task.id] || { done: false, video: null };
                    const card = document.createElement('div');
                    card.className = `task-card ${status.done ? 'completed' : ''}`;
                    
                    card.innerHTML = `
                        <div class="task-top">
                            <input type="checkbox" class="task-checkbox" ${status.done ? 'checked' : ''} disabled title="Progreso público de solo lectura">
                            <div class="task-info" onclick="openModal('${task.id}')">
                                <div class="task-name">${task.name}</div>
                                <div class="task-character">${task.character || 'Historia'}</div>
                            </div>
                        </div>
                        <div class="task-bottom">
                            <span class="difficulty diff-${task.diff}">${task.diff}</span>
                            <button class="btn-modal" onclick="openModal('${task.id}')">${status.video ? '📺 Ver Video' : 'ℹ️ Ficha'}</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            calcProgress();
            attachMenuSounds();
        }

        function handleSearch() {
            currentFilter = document.getElementById('searchInput').value;
            renderTasks();
        }

        function calcProgress() {
            const completed = tasks.filter(t => publicProgress[GAME_ID][t.id] && publicProgress[GAME_ID][t.id].done).length;
            const pct = Math.round((completed / tasks.length) * 100);

            document.getElementById('pctDisplay').innerText = `${pct}%`;
            document.getElementById('barDisplay').style.width = `${pct}%`;
            document.getElementById('statsText').innerText = `${completed} de ${tasks.length} misiones de historia completadas por el creador`;
        }

        function openModal(taskId) {
            activeTaskId = taskId;
            const task = tasks.find(t => t.id === taskId);
            const data = publicProgress[GAME_ID][taskId] || {};

            document.getElementById('mName').innerText = task.name;
            document.getElementById('mCharacter').innerText = `Dador / Tipo: ${task.character}`;
            document.getElementById('mDesc').innerText = task.desc;
            document.getElementById('mReward').innerText = `Recompensa: ${task.reward}`;

            const diffElem = document.getElementById('mDiff');
            diffElem.className = `difficulty diff-${task.diff}`;
            diffElem.innerText = task.diff;

            const objList = document.getElementById('mObjectives');
            objList.innerHTML = '';
            if (task.objectives && task.objectives.length > 0) {
                task.objectives.forEach(obj => {
                    const li = document.createElement('li');
                    li.innerText = obj;
                    objList.appendChild(li);
                });
            } else {
                objList.innerHTML = '<li>Completar la misión con éxito.</li>';
            }

            const bgMusic = document.getElementById('bgMusic');
            if (data.video && bgMusic && !bgMusic.paused) {
                pauseMusic();
            }

            showVideo(data.video);
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
            document.getElementById('mVideoViewer').innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">Sin video adjunto</span>';
        }

        function showVideo(src) {
            const box = document.getElementById('mVideoViewer');
            if (!src) {
                box.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-dim);">El creador aún no ha subido video para esta misión.</span>';
                return;
            }
            if (src.includes('youtube.com') || src.includes('youtu.be')) {
                let url = src.includes('watch?v=') ? src.replace('watch?v=', 'embed/') : src.replace('youtu.be/', 'www.youtube.com/embed/');
                box.innerHTML = `<iframe src="${url}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                box.innerHTML = `<video controls autoplay src="${src}"></video>`;
            }
        }

        const audio = document.getElementById('bgMusic');
        const btn = document.getElementById('musicToggleBtn');
        const status = document.getElementById('musicStatus');

        function setupMusicPersistence() {
            if (!audio) return;
            const savedTime = localStorage.getItem('gta_music_time');
            const isPlaying = localStorage.getItem('gta_music_playing') === 'true';

            if (savedTime) audio.currentTime = parseFloat(savedTime);

            if (isPlaying) {
                audio.volume = 0.35;
                audio.play().then(() => {
                    if (btn) btn.innerText = "⏸";
                    if (status) status.innerText = "Reproduciendo";
                }).catch(() => {
                    if (btn) btn.innerText = "▶";
                    if (status) status.innerText = "Pausado";
                });
            }

            audio.addEventListener('timeupdate', () => {
                localStorage.setItem('gta_music_time', audio.currentTime);
            });
        }

        function togglePlayMusic() {
            if (!audio) return;
            if (audio.paused) {
                audio.volume = 0.35;
                audio.play().then(() => {
                    btn.innerText = "⏸";
                    status.innerText = "Reproduciendo";
                    localStorage.setItem('gta_music_playing', 'true');
                }).catch(() => {
                    alert("Haz clic en la página para permitir la reproducción de audio.");
                });
            } else {
                pauseMusic();
            }
        }

        function pauseMusic() {
            if (!audio) return;
            audio.pause();
            if (btn) btn.innerText = "▶";
            if (status) status.innerText = "Pausado";
            localStorage.setItem('gta_music_playing', 'false');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
